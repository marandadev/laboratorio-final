name: DevSecOps
on:
  push:
    branches:
      - feature_pipeline
jobs:
  pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache SonarCloud packages
        uses: actions/cache@v3
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Install SonarCloud Scanner
        run: |
          curl -sSLo sonar-scanner.zip https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-5.0.1.3006.zip
          unzip sonar-scanner.zip
          mv sonar-scanner-5.0.1.3006 sonar-scanner

      - name: Run SonarCloud Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ./sonar-scanner/bin/sonar-scanner \
            -Dsonar.projectKey=marandadev_laboratorio-final \
            -Dsonar.organization=marandadev \
            -Dsonar.sources=. \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.login=${SONAR_TOKEN}

      - name: Análisis SCA (Dependency-Check)
        uses: dependency-check/Dependency-Check_Action@main
        with:
          failOnCVSS: 5.0
        continue-on-error: false

      - name: Construcción de la Imagen Docker
        run: |
          docker build -t movies-app:latest .

      - name: Análisis de Seguridad de Imagen (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: movies-app:latest
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: 1
        continue-on-error: false

      - name: Despliegue local (Minikube o Docker)
        run: |
          docker run -d -p 8080:80 movies-app:latest

      - name: DAST con OWASP ZAP
        uses: zaproxy/action-full-scan@v0.9.0
        with:
          target: "http://localhost:8080"
        continue-on-error: false