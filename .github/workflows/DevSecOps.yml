name: DevSecOps
on:
  push:
    branches:
      - feature_pipeline
jobs:
  pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v3

      - name: Análisis SAST (SonarCloud)
        uses: SonarSource/sonarcloud-github-action@v1.9
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: marandadev_laboratorio-final
          SONAR_ORGANIZATION: marandadev
        with:
          projectBaseDir: .
        continue-on-error: false

      - name: Análisis SCA (Dependency-Check)
        uses: dependency-check/Dependency-Check_Action@main
        with:
          failOnCVSS: 5.0
        continue-on-error: false

      - name: Construcción de la Imagen Docker
        run: |
          docker build -t movies-app:latest .

      - name: Análisis de Seguridad de Imagen (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: movies-app:latest
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: 1
        continue-on-error: false

      - name: Despliegue local (Minikube o Docker)
        run: |
          docker run -d -p 8080:80 movies-app:latest

      - name: DAST con OWASP ZAP
        uses: zaproxy/action-full-scan@v0.9.0
        with:
          target: "http://localhost:8080"
        continue-on-error: false